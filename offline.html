<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1
    "
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>
    TF Fitness BJJ
  </title>


  <style>

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      text-align: center;
      padding: 30px;
    }


    .card {
      width: 100%;
      max-width: 500px;
      background: #1d1d1d;
      border-radius: 18px;
      padding: 30px;
    }


    .brand {
      color: #f5c400;
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 8px;
    }


    h1 {
      font-size: 24px;
      margin:
        20px 0 15px 0;
    }


    p {
      color: #ccc;
      line-height: 1.6;
    }


    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #f5c400;
      color: #000;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

  </style>

</head>


<body>


  <div class="card">

    <div class="brand">
      TF FITNESS
    </div>

    <div>
      BJJ ATTENDANCE
    </div>


    <h1>
      Internet connection required
    </h1>


    <p>

      Attendance data is stored in the
      TF Fitness live database, so the
      BJJ attendance app requires an
      internet connection.

    </p>


    <button
      onclick="window.location.reload()">

      TRY AGAIN

    </button>

  </div>


</body>

</html>
